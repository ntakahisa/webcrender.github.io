<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天体・月齢カレンダー (2026年8月〜2028年8月)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased pb-24">

  <!-- ヘッダー / 制御バー -->
  <header class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur border-b border-slate-800 p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- タイトルと現在年月 -->
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg border border-indigo-500/30">
          <i data-lucide="moon" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-200 via-sky-200 to-amber-100 bg-clip-text text-transparent">
            月齢・天体カレンダー
          </h1>
          <p id="currentYearMonth" class="text-sm font-semibold text-indigo-300">2026年 8月</p>
        </div>
      </div>

      <!-- ナビゲーション＆ビュー切り替え -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- 前月 / 次月 ボタン -->
        <div class="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
          <button id="prevBtn" class="p-1.5 hover:bg-slate-700 rounded text-slate-300 hover:text-white transition">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <button id="todayBtn" class="px-3 py-1 text-xs font-medium hover:bg-slate-700 rounded text-slate-300 hover:text-white transition">
            2026-08-13へ
          </button>
          <button id="nextBtn" class="p-1.5 hover:bg-slate-700 rounded text-slate-300 hover:text-white transition">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- 月表示 / 週表示 切り替え -->
        <div class="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
          <button id="monthViewBtn" class="px-3 py-1 text-xs font-semibold rounded bg-indigo-600 text-white shadow transition">
            月表示
          </button>
          <button id="weekViewBtn" class="px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-white transition">
            週表示
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 md:p-6">
    
    <!-- 範囲制限通知 -->
    <div id="rangeNotice" class="hidden mb-4 p-3 bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-lg text-xs flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span>表示可能範囲は <strong>2026年8月 〜 2028年8月</strong> です。</span>
    </div>

    <!-- カレンダー表示コンテナ -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
      <!-- 曜日ヘッダー -->
      <div class="grid grid-cols-7 border-b border-slate-800 bg-slate-900/50 text-center text-xs font-semibold py-2.5">
        <span class="text-red-400">日</span>
        <span class="text-slate-400">月</span>
        <span class="text-slate-400">火</span>
        <span class="text-slate-400">水</span>
        <span class="text-slate-400">木</span>
        <span class="text-slate-400">金</span>
        <span class="text-blue-400">土</span>
      </div>

      <!-- 日付グリッド -->
      <div id="calendarGrid" class="grid grid-cols-7 divide-x divide-y divide-slate-800/60 bg-slate-950">
        <!-- JSで動的生成 -->
      </div>
    </div>
  </main>

  <!-- 下部ジャンプツールバー -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur border-t border-slate-800 p-3 shadow-2xl">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-sm">
      
      <div class="flex items-center gap-2 text-slate-300 text-xs sm:text-sm">
        <i data-lucide="navigation" class="w-4 h-4 text-indigo-400"></i>
        <span>指定日付からの移動:</span>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <!-- 基準日入力 -->
        <input type="date" id="jumpBaseDate" value="2026-08-13" min="2026-08-01" max="2028-08-31"
          class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
        
        <span class="text-slate-400 text-xs">から</span>

        <!-- 日数入力 -->
        <input type="number" id="jumpDays" value="30" min="1" max="730" placeholder="日数"
          class="w-20 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 text-center">
        
        <span class="text-slate-400 text-xs">日</span>

        <!-- 前へ / 後へ ボタン -->
        <div class="flex gap-1.5 ml-auto sm:ml-0">
          <button id="jumpPrevBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-indigo-300 font-medium text-xs rounded-lg border border-slate-700 transition flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            前へ
          </button>
          <button id="jumpNextBtn" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-lg shadow transition flex items-center gap-1">
            次へ
            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>
  </footer>

  <!-- 天体・レンダーJavaScript -->
  <script>
    // --- 1. 定数・天体パラメータ設定 ---
    const MIN_DATE = new Date(2026, 7, 1);   // 2026-08-01
    const MAX_DATE = new Date(2028, 7, 31);  // 2028-08-31
    
    // 国立天文台データに基づく平均朔望月（日）
    const SYNODIC_MONTH = 29.53058867;
    
    // 国立天文台 暦要項: 2026年8月13日 02:37:00 (JST) が 朔（新月 = 月齢 0.0）
    const KNOWN_NEW_MOON = new Date(Date.UTC(2026, 7, 12, 17, 37, 0));

    // イベント登録（終日予定）
    const EVENTS = {
      '2026-08-13': ['交点を太陽が通過する']
    };

    let currentDate = new Date(2026, 7, 13); // 初期表示: 2026年8月13日
    let currentView = 'month';              // 'month' または 'week'

    // --- 2. 天文学的月齢・月形計算 ---

    /**
     * 国立天文台定義に沿った正午(JST)基準の月齢計算 (0.0 〜 SYNODIC_MONTH)
     */
    function calculateMoonAge(date) {
      const targetUtc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 3, 0, 0));
      const diffDays = (targetUtc - KNOWN_NEW_MOON) / (1000 * 60 * 60 * 24);
      let age = diffDays % SYNODIC_MONTH;
      if (age < 0) age += SYNODIC_MONTH;
      return age;
    }

    /**
     * 1日に1回だけ「新月」「満月」等の代表名詞を表示する判定ロジック（幅を±0.5日に厳格化）
     */
    function getMoonPhaseLabel(age) {
      // 1サイクルは29.53日。判定幅を1.0日未満にすることで、1サイクルにつき必ず1日だけ該当する
      if (age < 0.5 || age > SYNODIC_MONTH - 0.5) return '新月';
      if (Math.abs(age - SYNODIC_MONTH * 0.25) < 0.5) return '上弦';
      if (Math.abs(age - SYNODIC_MONTH * 0.5) < 0.5) return '満月';
      if (Math.abs(age - SYNODIC_MONTH * 0.75) < 0.5) return '下弦';
      return `月齢 ${age.toFixed(1)}`;
    }

    /**
     * 月形（SVG）描画関数
     */
    function createMoonSvg(age) {
      const size = 22;
      const r = 9;
      const cx = 11;
      const cy = 11;

      // 新月：完全な暗い円
      if (age < 0.5 || age > SYNODIC_MONTH - 0.5) {
        return `<svg width="${size}" height="${size}" class="inline-block">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        </svg>`;
      }

      // 満月：完全に輝く円
      if (Math.abs(age - SYNODIC_MONTH * 0.5) < 0.5) {
        return `<svg width="${size}" height="${size}" class="inline-block drop-shadow-[0_0_6px_rgba(253,224,71,0.6)]">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fde047" stroke="#eab308" stroke-width="1.2"/>
        </svg>`;
      }

      const phase = age / SYNODIC_MONTH;
      const isWaxing = phase < 0.5; // 新月→満月（右が光る）

      const cosVal = Math.cos(phase * 2 * Math.PI);
      const rx = Math.abs(r * cosVal);

      let pathD = '';

      if (isWaxing) {
        if (cosVal >= 0) {
          pathD = `M ${cx} ${cy - r} 
                   A ${r} ${r} 0 0 1 ${cx} ${cy + r} 
                   A ${rx} ${r} 0 0 0 ${cx} ${cy - r}`;
        } else {
          pathD = `M ${cx} ${cy - r} 
                   A ${r} ${r} 0 0 1 ${cx} ${cy + r} 
                   A ${rx} ${r} 0 0 1 ${cx} ${cy - r}`;
        }
      } else {
        if (cosVal <= 0) {
          pathD = `M ${cx} ${cy - r} 
                   A ${r} ${r} 0 0 0 ${cx} ${cy + r} 
                   A ${rx} ${r} 0 0 0 ${cx} ${cy - r}`;
        } else {
          pathD = `M ${cx} ${cy - r} 
                   A ${r} ${r} 0 0 0 ${cx} ${cy + r} 
                   A ${rx} ${r} 0 0 1 ${cx} ${cy - r}`;
        }
      }

      return `<svg width="${size}" height="${size}" class="inline-block drop-shadow-[0_0_4px_rgba(253,224,71,0.4)]">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="${pathD}" fill="#fde047" />
      </svg>`;
    }

    // --- 3. カレンダーレンダリング ---

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      document.getElementById('currentYearMonth').textContent = 
        `${currentDate.getFullYear()}年 ${currentDate.getMonth() + 1}月`;

      const notice = document.getElementById('rangeNotice');
      if (currentDate < MIN_DATE || currentDate > MAX_DATE) {
        notice.classList.remove('hidden');
      } else {
        notice.classList.add('hidden');
      }

      let startDate, endDate;

      if (currentView === 'month') {
        const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
        startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - firstDay.getDay());

        const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
        endDate = new Date(lastDay);
        endDate.setDate(endDate.getDate() + (6 - lastDay.getDay()));
      } else {
        startDate = new Date(currentDate);
        startDate.setDate(startDate.getDate() - startDate.getDay());

        endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 6);
      }

      let iter = new Date(startDate);
      while (iter <= endDate) {
        const dateKey = formatDateKey(iter);
        const isCurrentMonth = iter.getMonth() === currentDate.getMonth();
        const isSelected = dateKey === formatDateKey(currentDate);
        const isTargetSpecialDate = dateKey === '2026-08-13';

        const moonAge = calculateMoonAge(iter);
        const moonLabel = getMoonPhaseLabel(moonAge);
        const moonSvg = createMoonSvg(moonAge);
        const dayEvents = EVENTS[dateKey] || [];

        const cell = document.createElement('div');
        cell.className = `min-h-[100px] sm:min-h-[120px] p-1.5 sm:p-2 transition relative flex flex-col justify-between cursor-pointer border-b border-r border-slate-800/60 ${
          !isCurrentMonth && currentView === 'month' ? 'bg-slate-950/40 text-slate-600' : 'bg-slate-900/40 text-slate-200'
        } ${isSelected ? 'ring-2 ring-indigo-500/80 bg-indigo-950/20 z-10' : 'hover:bg-slate-800/50'}`;

        const iterCopy = new Date(iter);
        cell.addEventListener('click', () => {
          currentDate = iterCopy;
          renderCalendar();
        });

        const dayNum = iter.getDate();
        const dayOfWeek = iter.getDay();
        let dayColorClass = 'text-slate-300';
        if (dayOfWeek === 0) dayColorClass = 'text-red-400 font-medium';
        if (dayOfWeek === 6) dayColorClass = 'text-blue-400 font-medium';

        const isSpecialPhase = moonLabel === '新月' || moonLabel === '満月' || moonLabel === '上弦' || moonLabel === '下弦';

        const topHtml = `
          <div class="flex items-start justify-between gap-1 mb-1">
            <span class="inline-flex items-center justify-center w-6 h-6 text-xs sm:text-sm font-semibold rounded-full ${
              isTargetSpecialDate ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20' : dayColorClass
            }">
              ${dayNum}
            </span>
            <div class="flex flex-col items-end text-[10px] sm:text-xs leading-tight">
              ${moonSvg}
              <span class="mt-0.5 font-mono ${isSpecialPhase ? 'text-amber-300 font-bold' : 'text-slate-400'}">
                ${moonLabel}
              </span>
            </div>
          </div>
        `;

        let eventsHtml = '<div class="space-y-1 mt-1 overflow-y-auto max-h-[55px]">';
        dayEvents.forEach(evt => {
          eventsHtml += `
            <div class="text-[10px] sm:text-xs p-1 rounded bg-amber-500/20 border border-amber-500/40 text-amber-200 font-medium truncate flex items-center gap-1 shadow-sm">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0"></span>
              <span class="truncate">${evt}</span>
            </div>
          `;
        });
        eventsHtml += '</div>';

        cell.innerHTML = topHtml + eventsHtml;
        grid.appendChild(cell);

        iter.setDate(iter.getDate() + 1);
      }

      lucide.createIcons();
    }

    // --- 4. イベントハンドラー ---

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentView === 'month') {
        currentDate.setMonth(currentDate.getMonth() - 1);
      } else {
        currentDate.setDate(currentDate.getDate() - 7);
      }
      renderCalendar();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentView === 'month') {
        currentDate.setMonth(currentDate.getMonth() + 1);
      } else {
        currentDate.setDate(currentDate.getDate() + 7);
      }
      renderCalendar();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date(2026, 7, 13);
      renderCalendar();
    });

    const monthBtn = document.getElementById('monthViewBtn');
    const weekBtn = document.getElementById('weekViewBtn');

    monthBtn.addEventListener('click', () => {
      currentView = 'month';
      monthBtn.className = "px-3 py-1 text-xs font-semibold rounded bg-indigo-600 text-white shadow transition";
      weekBtn.className = "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-white transition";
      renderCalendar();
    });

    weekBtn.addEventListener('click', () => {
      currentView = 'week';
      weekBtn.className = "px-3 py-1 text-xs font-semibold rounded bg-indigo-600 text-white shadow transition";
      monthBtn.className = "px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-white transition";
      renderCalendar();
    });

    function handleJump(isForward) {
      const baseInput = document.getElementById('jumpBaseDate').value;
      const daysInput = parseInt(document.getElementById('jumpDays').value, 10);

      if (!baseInput || isNaN(daysInput) || daysInput <= 0) {
        alert('正しい基準日と日数（1以上）を入力してください。');
        return;
      }

      const [y, m, d] = baseInput.split('-').map(Number);
      const baseDate = new Date(y, m - 1, d);

      const offset = isForward ? daysInput : -daysInput;
      baseDate.setDate(baseDate.getDate() + offset);

      currentDate = baseDate;
      renderCalendar();
    }

    document.getElementById('jumpPrevBtn').addEventListener('click', () => handleJump(false));
    document.getElementById('jumpNextBtn').addEventListener('click', () => handleJump(true));

    renderCalendar();
  </script>
</body>
</html>
