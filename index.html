<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インタラクティブ Webカレンダー (2026/08 - 2028/08)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts (Inter + Noto Sans JP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        /* Custom scrollbar for weekly view */
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex-none shadow-sm z-10">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <!-- App Title & Date Range Indicator -->
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-200">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 id="currentPeriodTitle" class="text-xl font-bold text-slate-900 leading-tight">2026年 8月</h1>
                    <span class="text-xs text-slate-500 font-medium">利用可能期間: 2026年8月 〜 2028年8月</span>
                </div>
            </div>

            <!-- Calendar Navigation & Today Button -->
            <div class="flex items-center gap-2">
                <button id="prevBtn" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors border border-slate-200" title="前へ">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <button id="todayBtn" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-lg text-sm transition-colors border border-indigo-200 flex items-center gap-1.5">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>2026年8月20日へ</span>
                </button>
                <button id="nextBtn" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors border border-slate-200" title="次へ">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- View Switching Toggle -->
            <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-sm font-medium">
                <button id="monthViewBtn" class="px-4 py-1.5 rounded-lg text-slate-700 transition-all shadow-sm bg-white font-semibold">月表示</button>
                <button id="weekViewBtn" class="px-4 py-1.5 rounded-lg text-slate-500 transition-all hover:text-slate-900">週表示</button>
            </div>

        </div>
    </header>

    <!-- Main Calendar Area -->
    <main class="flex-1 overflow-hidden relative flex flex-col bg-slate-50">
        <!-- Calendar Grid Header (Days of week) -->
        <div class="grid grid-cols-7 bg-white border-b border-slate-200 text-center text-xs font-semibold text-slate-500 py-2.5 shadow-xs">
            <div class="text-red-500">日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div class="text-blue-500">土</div>
        </div>

        <!-- Scrollable Grid Container -->
        <div id="calendarContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3">
            <!-- Dynamic Calendar Content Generated by JS -->
            <div id="calendarGrid" class="h-full"></div>
        </div>
    </main>

    <!-- Bottom Date Jump Toolbar -->
    <footer class="bg-white border-t border-slate-200 p-3 flex-none shadow-lg z-20">
        <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-2.5 rounded-2xl border border-slate-200">
            <div class="flex items-center gap-2 text-sm font-bold text-slate-700 pl-1">
                <i data-lucide="rocket" class="w-4 h-4 text-indigo-600"></i>
                <span>日付ジャンプ機能:</span>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 text-sm flex-1 justify-end">
                <!-- Base Date Picker -->
                <div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-xl border border-slate-300 shadow-xs">
                    <label for="baseDateInput" class="text-xs text-slate-500 font-medium">基準日:</label>
                    <input type="date" id="baseDateInput" min="2026-08-01" max="2028-08-31" class="text-xs font-semibold text-slate-800 focus:outline-none bg-transparent">
                </div>

                <span class="text-slate-400 font-bold">+</span>

                <!-- Offset Days Input -->
                <div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-xl border border-slate-300 shadow-xs w-32">
                    <input type="number" id="offsetDaysInput" placeholder="0" class="w-full text-xs font-semibold text-slate-800 focus:outline-none text-right pr-1" value="0">
                    <span class="text-xs text-slate-500 font-medium">日後</span>
                </div>

                <!-- Jump Action Button -->
                <button id="jumpBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-1.5 rounded-xl text-xs transition-colors flex items-center gap-1 shadow-sm shadow-indigo-200 active:scale-95">
                    <span>移動</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Event Detail & Creation Modal -->
    <div id="eventModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 border border-slate-100 transform transition-all scale-100">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalDateTitle" class="text-base font-bold text-slate-900">2026年8月20日の予定</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Existing Events List -->
            <div id="modalEventList" class="space-y-2 mb-4 max-h-40 overflow-y-auto custom-scrollbar">
                <!-- Events populated dynamically -->
            </div>

            <!-- Add New Event Form -->
            <div class="border-t border-slate-100 pt-3">
                <label for="newEventInput" class="block text-xs font-semibold text-slate-600 mb-1">新しい予定を追加</label>
                <div class="flex gap-2">
                    <input type="text" id="newEventInput" placeholder="例: 打ち合わせ" class="flex-1 px-3 py-1.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    <button id="addEventBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-colors">追加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // --- CONSTANTS & INITIAL STATE ---
        const MIN_DATE = new Date(2026, 7, 1);  // Aug 1, 2026
        const MAX_DATE = new Date(2028, 7, 31); // Aug 31, 2028
        const DEFAULT_DATE = new Date(2026, 7, 20); // Aug 20, 2026

        let currentView = 'month'; // 'month' or 'week'
        let currentDate = new Date(DEFAULT_DATE); // The anchor date currently viewed
        let selectedDate = new Date(DEFAULT_DATE); // Specific highlighted/clicked date

        // Events Storage (Initial predefined event + localStorage)
        const PREDEFINED_EVENTS = {
            '2026-08-20': [
                { id: 'default-1', title: '交点に太陽と月が並ぶ', isSpecial: true }
            ]
        };

        let userEvents = {};
        try {
            const stored = localStorage.getItem('web_calendar_events');
            if (stored) userEvents = JSON.parse(stored);
        } catch (e) {
            console.warn('LocalStorage access failed:', e);
        }

        // --- DOM ELEMENTS ---
        const currentPeriodTitle = document.getElementById('currentPeriodTitle');
        const calendarGrid = document.getElementById('calendarGrid');
        const monthViewBtn = document.getElementById('monthViewBtn');
        const weekViewBtn = document.getElementById('weekViewBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const todayBtn = document.getElementById('todayBtn');
        
        const baseDateInput = document.getElementById('baseDateInput');
        const offsetDaysInput = document.getElementById('offsetDaysInput');
        const jumpBtn = document.getElementById('jumpBtn');

        const eventModal = document.getElementById('eventModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const modalEventList = document.getElementById('modalEventList');
        const newEventInput = document.getElementById('newEventInput');
        const addEventBtn = document.getElementById('addEventBtn');

        // --- HELPER FUNCTIONS ---
        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function clampDate(date) {
            if (date < MIN_DATE) return new Date(MIN_DATE);
            if (date > MAX_DATE) return new Date(MAX_DATE);
            return new Date(date);
        }

        function getEventsForDate(dateKey) {
            const predefined = PREDEFINED_EVENTS[dateKey] || [];
            const custom = userEvents[dateKey] || [];
            return [...predefined, ...custom];
        }

        function saveCustomEvents() {
            try {
                localStorage.setItem('web_calendar_events', JSON.stringify(userEvents));
            } catch (e) {
                console.error('Failed to save to localStorage', e);
            }
        }

        // --- RENDER LOGIC ---
        function render() {
            if (currentView === 'month') {
                renderMonthView();
            } else {
                renderWeekView();
            }
            updateToolbarInputs();
            lucide.createIcons();
        }

        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Header Title
            currentPeriodTitle.textContent = `${year}年 ${month + 1}月`;

            // First day of current month & total days
            const firstDayOfMonth = new Date(year, month, 1);
            const startingDayOfWeek = firstDayOfMonth.getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Previous month tail days
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            let html = '<div class="grid grid-cols-7 gap-1.5 h-full auto-rows-fr">';

            // 1. Prev Month Days
            for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                const prevDate = new Date(year, month - 1, daysInPrevMonth - i);
                html += createDayCellHTML(prevDate, true);
            }

            // 2. Current Month Days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                html += createDayCellHTML(dayDate, false);
            }

            // 3. Next Month Days to complete 6-row or 5-row grid
            const totalCells = startingDayOfWeek + daysInMonth;
            const nextDays = (totalCells > 35 ? 42 : 35) - totalCells;
            for (let i = 1; i <= nextDays; i++) {
                const nextDate = new Date(year, month + 1, i);
                html += createDayCellHTML(nextDate, true);
            }

            html += '</div>';
            calendarGrid.innerHTML = html;
            attachCellEvents();
        }

        function renderWeekView() {
            // Find Sunday of the current week
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);

            // Header Title
            const startStr = `${startOfWeek.getFullYear()}年${startOfWeek.getMonth() + 1}月${startOfWeek.getDate()}日`;
            const endStr = `${endOfWeek.getFullYear()}年${endOfWeek.getMonth() + 1}月${endOfWeek.getDate()}日`;
            currentPeriodTitle.textContent = `${startOfWeek.getFullYear()}年 ${startOfWeek.getMonth() + 1}月 (週表示)`;

            let html = '<div class="grid grid-cols-7 gap-2 h-full min-h-[400px]">';

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(startOfWeek.getDate() + i);
                const isOutOfRange = dayDate < MIN_DATE || dayDate > MAX_DATE;
                html += createDayCellHTML(dayDate, isOutOfRange, true);
            }

            html += '</div>';
            calendarGrid.innerHTML = html;
            attachCellEvents();
        }

        function createDayCellHTML(date, isOtherMonth = false, isWeekView = false) {
            const dateKey = formatDateKey(date);
            const events = getEventsForDate(dateKey);
            const isSelected = isSameDay(date, selectedDate);
            const isTargetAug20 = dateKey === '2026-08-20';

            const dayNum = date.getDate();
            const dayOfWeek = date.getDay();

            // Text color styling
            let textColor = 'text-slate-800';
            if (isOtherMonth) textColor = 'text-slate-300';
            else if (dayOfWeek === 0) textColor = 'text-red-500';
            else if (dayOfWeek === 6) textColor = 'text-blue-500';

            // Cell border & bg styling
            let bgStyle = 'bg-white hover:bg-slate-50/80';
            let borderStyle = 'border-slate-200';

            if (isOtherMonth) {
                bgStyle = 'bg-slate-50/50';
            }

            if (isSelected) {
                borderStyle = 'border-indigo-600 ring-2 ring-indigo-500/20';
            }

            if (isTargetAug20) {
                bgStyle = 'bg-amber-50/60 hover:bg-amber-50';
                borderStyle = 'border-amber-400 ring-2 ring-amber-300/30';
            }

            // Render Events Badges
            let eventsHTML = '';
            events.forEach(evt => {
                if (evt.isSpecial) {
                    eventsHTML += `
                        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white text-[11px] font-bold p-1.5 rounded-lg shadow-xs flex items-center gap-1 leading-tight my-0.5">
                            <i data-lucide="sun-moon" class="w-3.5 h-3.5 shrink-0"></i>
                            <span class="truncate">${evt.title}</span>
                        </div>
                    `;
                } else {
                    eventsHTML += `
                        <div class="bg-indigo-50 text-indigo-700 border border-indigo-100 text-[11px] font-medium p-1 rounded-md leading-tight my-0.5 truncate">
                            ${evt.title}
                        </div>
                    `;
                }
            });

            return `
                <div data-date="${dateKey}" class="day-cell flex flex-col justify-between p-2 rounded-xl border ${borderStyle} ${bgStyle} transition-all cursor-pointer relative min-h-[80px] overflow-hidden group">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold ${textColor} ${isSelected ? 'bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center -ml-1 -mt-1 shadow-xs' : ''}">
                            ${dayNum}
                        </span>
                        ${isTargetAug20 ? '<span class="text-[10px] font-bold text-amber-600 bg-amber-100 px-1.5 py-0.5 rounded-full">注目日</span>' : ''}
                    </div>
                    <div class="flex-1 mt-1 overflow-y-auto custom-scrollbar">
                        ${eventsHTML}
                    </div>
                </div>
            `;
        }

        function attachCellEvents() {
            document.querySelectorAll('.day-cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    const dateStr = cell.getAttribute('data-date');
                    const [y, m, d] = dateStr.split('-').map(Number);
                    selectedDate = new Date(y, m - 1, d);
                    openEventModal(selectedDate);
                    render();
                });
            });
        }

        // --- TOOLBAR & NAVIGATION HANDLERS ---
        function updateToolbarInputs() {
            baseDateInput.value = formatDateKey(selectedDate);
        }

        function handleJump() {
            const baseStr = baseDateInput.value;
            const offset = parseInt(offsetDaysInput.value, 10) || 0;

            if (!baseStr) return;

            const [y, m, d] = baseStr.split('-').map(Number);
            const baseDate = new Date(y, m - 1, d);
            
            // Add offset days
            const targetDate = new Date(baseDate);
            targetDate.setDate(baseDate.getDate() + offset);

            // Clamp inside allowed bounds
            const finalDate = clampDate(targetDate);
            currentDate = new Date(finalDate);
            selectedDate = new Date(finalDate);

            render();
        }

        // --- MODAL HANDLERS ---
        function openEventModal(date) {
            const dateKey = formatDateKey(date);
            const events = getEventsForDate(dateKey);

            modalDateTitle.textContent = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日の予定`;
            modalEventList.innerHTML = '';

            if (events.length === 0) {
                modalEventList.innerHTML = '<p class="text-xs text-slate-400 py-2 text-center">予定はありません</p>';
            } else {
                events.forEach(evt => {
                    const item = document.createElement('div');
                    item.className = `flex justify-between items-center p-2 rounded-xl text-xs font-medium ${evt.isSpecial ? 'bg-amber-100 text-amber-900 border border-amber-200' : 'bg-slate-100 text-slate-700'}`;
                    item.innerHTML = `
                        <span class="flex items-center gap-1.5 font-semibold">
                            ${evt.isSpecial ? '<i data-lucide="sun-moon" class="w-4 h-4 text-amber-600"></i>' : '<i data-lucide="calendar-event" class="w-4 h-4 text-indigo-500"></i>'}
                            ${evt.title}
                        </span>
                        ${!evt.isSpecial ? `<button data-id="${evt.id}" class="delete-evt-btn text-slate-400 hover:text-red-500 p-0.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                    `;
                    modalEventList.appendChild(item);
                });

                // Attach delete event listeners
                modalEventList.querySelectorAll('.delete-evt-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        userEvents[dateKey] = (userEvents[dateKey] || []).filter(item => item.id !== id);
                        saveCustomEvents();
                        openEventModal(date);
                        render();
                    });
                });
            }

            newEventInput.value = '';
            eventModal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeEventModal() {
            eventModal.classList.add('hidden');
        }

        // --- EVENT LISTENERS ---
        monthViewBtn.addEventListener('click', () => {
            currentView = 'month';
            monthViewBtn.className = "px-4 py-1.5 rounded-lg text-slate-700 transition-all shadow-sm bg-white font-semibold";
            weekViewBtn.className = "px-4 py-1.5 rounded-lg text-slate-500 transition-all hover:text-slate-900";
            render();
        });

        weekViewBtn.addEventListener('click', () => {
            currentView = 'week';
            weekViewBtn.className = "px-4 py-1.5 rounded-lg text-slate-700 transition-all shadow-sm bg-white font-semibold";
            monthViewBtn.className = "px-4 py-1.5 rounded-lg text-slate-500 transition-all hover:text-slate-900";
            render();
        });

        prevBtn.addEventListener('click', () => {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() - 1);
            } else {
                currentDate.setDate(currentDate.getDate() - 7);
            }
            currentDate = clampDate(currentDate);
            render();
        });

        nextBtn.addEventListener('click', () => {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + 1);
            } else {
                currentDate.setDate(currentDate.getDate() + 7);
            }
            currentDate = clampDate(currentDate);
            render();
        });

        todayBtn.addEventListener('click', () => {
            currentDate = new Date(DEFAULT_DATE);
            selectedDate = new Date(DEFAULT_DATE);
            render();
        });

        jumpBtn.addEventListener('click', handleJump);

        offsetDaysInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleJump();
        });

        closeModalBtn.addEventListener('click', closeEventModal);
        
        eventModal.addEventListener('click', (e) => {
            if (e.target === eventModal) closeEventModal();
        });

        addEventBtn.addEventListener('click', () => {
            const title = newEventInput.value.trim();
            if (!title) return;

            const dateKey = formatDateKey(selectedDate);
            if (!userEvents[dateKey]) userEvents[dateKey] = [];

            userEvents[dateKey].push({
                id: 'evt-' + Date.now(),
                title: title
            });

            saveCustomEvents();
            openEventModal(selectedDate);
            render();
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
